<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#130d25">
<title>GTA VI Countdown</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;
    color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:radial-gradient(ellipse at 50% 0%,#743b8f 0%,#26143e 42%,#100d20 100%)}
  main{width:min(680px,100%);text-align:center;padding:clamp(22px,5vw,42px);
    border:1px solid #ffffff30;border-radius:26px;background:#100d20b8;
    box-shadow:0 24px 80px #0008;backdrop-filter:blur(12px)}
  .eyebrow{letter-spacing:.28em;font-size:.75rem;color:#f6b4d2;font-weight:700}
  h1{font-size:clamp(3rem,12vw,6rem);line-height:1;margin:12px 0 4px;
    letter-spacing:-.07em;text-shadow:0 4px 30px #ff5bba80}
  .subtitle{font-size:clamp(.9rem,3vw,1.15rem);letter-spacing:.18em;color:#f4c5df}
  .date{margin:28px 0 18px;color:#e9d9f5;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .unit{padding:18px 5px;border-radius:16px;background:#ffffff12;border:1px solid #ffffff20}
  .number{font-variant-numeric:tabular-nums;font-size:clamp(1.8rem,7vw,3.4rem);font-weight:800}
  .label{font-size:.65rem;letter-spacing:.14em;color:#d9c4e8;font-weight:700}
  .status{margin-top:24px;color:#ffb6dc;font-size:.75rem;letter-spacing:.18em;font-weight:700}
  footer{margin-top:24px;color:#bda9cd;font-size:.75rem}
  @media(max-width:390px){.grid{gap:6px}.unit{padding:14px 2px}.label{font-size:.58rem}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">THE COUNTDOWN IS ON</div>
  <h1>GTA VI</h1>
  <div class="subtitle">VICE CITY AWAITS</div>
  <div class="date">NOVEMBER 18, 2026 · 6:00 AM EST</div>
  <section class="grid" aria-live="off">
    <div class="unit"><div class="number" id="days">--</div><div class="label">DAYS</div></div>
    <div class="unit"><div class="number" id="hours">--</div><div class="label">HOURS</div></div>
    <div class="unit"><div class="number" id="minutes">--</div><div class="label">MINUTES</div></div>
    <div class="unit"><div class="number" id="seconds">--</div><div class="label">SECONDS</div></div>
  </section>
  <div class="status" id="status">LIVE COUNTDOWN</div>
  <footer>Countdown target: Eastern Standard Time (UTC−5)</footer>
</main>
<script>
const target = new Date("2026-11-18T06:00:00-05:00").getTime();
const ids = ["days","hours","minutes","seconds"];
function update(){
  let remaining = Math.max(0,target-Date.now());
  const values = [
    Math.floor(remaining/86400000),
    Math.floor(remaining%86400000/3600000),
    Math.floor(remaining%3600000/60000),
    Math.floor(remaining%60000/1000)
  ];
  ids.forEach((id,i)=>document.getElementById(id).textContent=String(values[i]).padStart(2,"0"));
  if(remaining===0) document.getElementById("status").textContent="THE WAIT IS OVER";
}
update(); setInterval(update,1000);
</script>
</body>
</html>
